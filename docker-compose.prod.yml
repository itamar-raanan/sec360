# ── Production compose — no source mounts, no --reload ───────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required: .env file in the same directory (see .env.example)
# Required: ssl/server.crt + ssl/server.key  (run ./setup.sh to generate)

services:

  # Seeds the persistent certificate store once. Certificates uploaded in the
  # Settings UI remain in this volume across rebuilds and container recreation.
  certificates:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /certs/server.crt ] || [ ! -s /certs/server.key ]; then
          cp /seed/server.crt /certs/server.crt
          cp /seed/server.key /certs/server.key
        fi
        chown -R 1000:1000 /certs
        chmod 700 /certs
        chmod 644 /certs/server.crt
        chmod 600 /certs/server.key
    volumes:
      - ./ssl:/seed:ro
      - tls_data:/certs

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sec360}
      POSTGRES_USER:     ${POSTGRES_USER:-sec360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sec360} -d ${POSTGRES_DB:-sec360}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-sec360}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sec360}
    depends_on:
      postgres:
        condition: service_healthy
      certificates:
        condition: service_completed_successfully
    volumes:
      - tls_data:/var/lib/sec360/tls
    networks:
      - internal
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend + nginx (HTTPS) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - tls_data:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_started
      certificates:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  tls_data:
    driver: local
