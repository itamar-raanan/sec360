[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sec360-mcp"
version = "0.1.0"
description = "Read-only Model Context Protocol server for SEC360"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
sec360-mcp = "sec360_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sec360_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
