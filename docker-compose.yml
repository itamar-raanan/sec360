services:
  certificates:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /certs/server.crt ] || [ ! -s /certs/server.key ]; then
          cp /seed/server.crt /certs/server.crt
          cp /seed/server.key /certs/server.key
        fi
        chown -R 1000:1000 /certs
        chmod 700 /certs
        chmod 644 /certs/server.crt
        chmod 600 /certs/server.key
    volumes:
      - ./ssl:/seed:ro
      - tls_data:/certs

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sec360
      POSTGRES_USER: sec360
      POSTGRES_PASSWORD: sec360pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sec360 -d sec360"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      certificates:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - tls_data:/var/lib/sec360/tls
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tls_data:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_started
      certificates:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  tls_data:
